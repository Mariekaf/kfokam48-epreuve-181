spring.application.name=backend

# Base locale prête à l'emploi. Pour PostgreSQL, définir DB_URL/DB_USERNAME/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-stacktrace=never
